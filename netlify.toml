[build]
base = "app/frontend"
command = "pnpm run build:netlify"
publish = "dist"

[build.environment]
NODE_VERSION = "22"
VITE_DEPLOY_PLATFORM = "netlify"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "no-referrer"
X-Frame-Options = "DENY"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
