# Same-origin deployment: Nginx serves the SPA and proxies /api to FastAPI.
# Usage on ECS:
#   docker compose --env-file /etc/shansuan/compose.env up -d
# Required in compose.env: SHANSUAN_IMAGE, SHANSUAN_ENV_FILE
# TLS files: /etc/shansuan/tls/fullchain.pem and privkey.pem (mounted read-only).
services:
  backend:
    image: ${SHANSUAN_IMAGE:?set SHANSUAN_IMAGE to the SWR image}
    restart: unless-stopped
    env_file: ${SHANSUAN_ENV_FILE:-/etc/shansuan/cloud.env}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health/live',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${WEB_ROOT:-./web}:/usr/share/nginx/html:ro
      - ${TLS_DIR:-/etc/shansuan/tls}:/etc/nginx/tls:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"